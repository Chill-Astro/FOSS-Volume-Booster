<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #000000;
      --border-color: #ffffff;
      --text-main: #ffffff;
      --text-sub: #ffffff;
      --slider-track: #ffffff;
      --slider-thumb: #000000;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-main: #ffffff;
        --bg-card: #ffffff;
        --border-color: #000000;
        --text-main: #000000;
        --text-sub: #000000;
        --slider-track: #000000;
        --slider-thumb: #ffffff;
      }
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Tomorrow', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }

    .title-brand {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin: 0 0 20px 0;
      text-transform: uppercase;
      color: var(--text-main);
      font-family: 'Tomorrow', sans-serif;
      white-space: nowrap;
    }

    .display-container {
      background: var(--bg-main);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 20px;
    }

    .volume-readout {
      font-size: 32px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
      font-family: 'Tomorrow', sans-serif;
    }

    .slider-wrapper {
      position: relative;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      background: transparent;
      margin: 0;
      cursor: pointer;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 8px;
      background: var(--slider-track);
      border-radius: 4px;
      border: 2px solid var(--border-color);
    }

    input[type=range]::-moz-range-track {
      width: 100%;
      height: 8px;
      background: var(--slider-track);
      border-radius: 4px;
      border: 2px solid var(--border-color);
    }

    input[type=range]::-webkit-slider-thumb {
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: var(--slider-thumb);
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      margin-top: -9px;
      border: 2px solid var(--border-color);
    }

    input[type=range]::-moz-range-thumb {
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: var(--slider-thumb);
      cursor: pointer;
      border: 2px solid var(--border-color);
    }

    datalist {
      display: flex;
      justify-content: space-between;
      padding: 0 4px;
      margin-top: 8px;
    }

    option {
      padding: 0;
      font-size: 10px;
      color: var(--text-sub);
      font-weight: 700;
      font-family: 'Tomorrow', sans-serif;
    }

    .footer {
      margin-top: 18px;
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
      opacity: 0.9;
      font-family: 'Tomorrow', sans-serif;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 class="title-brand">FOSS Volume Booster</h1>

    <div class="display-container">
      <span id="vol-display" class="volume-readout">100%</span>
    </div>

    <div class="slider-wrapper">
      <input 
        type="range" 
        id="volume-slider" 
        min="100" 
        max="600" 
        value="100" 
        step="50" 
        list="tickmarks"
      >
      <datalist id="tickmarks">
        <option value="100" label="100%"></option>
        <option value="300" label="300%"></option>
        <option value="600" label="600%"></option>
      </datalist>
    </div>

    <div class="footer">
      Made with 💖 by Chill-Astro
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
